name: Build LibreWrist Watch5 Lite APK

on:
  push:
    branches:
      - librewrist-watch5-lite-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TOOLS_VERSION: "36.0.0"
      PLATFORM_API: "36"
      CATALOGUE_URL: "https://raw.githubusercontent.com/LibreStatic/LibreWrist/main/catalogue"
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Fetch LibreWrist base
        run: |
          git clone https://github.com/LibreStatic/LibreWrist.git librewrist
          cd librewrist
          git checkout 96ab317741142932ca23e9feed83a912b28dbbcb

      - name: Apply Watch5 Lite modifications
        run: |
          cd librewrist
          git apply --check ../librewrist-watch5-lite.patch
          git apply ../librewrist-watch5-lite.patch
          git apply --check ../librewrist-watch5-lite-auto.patch
          git apply ../librewrist-watch5-lite-auto.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("patcher-app/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "io.openshm.patcher"', 'applicationId = "io.openshm.patcher.watch5lite"')
          s = s.replace('versionName = "0.9.5-local"', 'versionName = "0.9.5-watch5lite-r3"')
          p.write_text(s)
          p = Path("patcher-app/app/src/main/res/values/strings.xml")
          s = p.read_text()
          s = s.replace('<string name="app_name" translatable="false">LibreWrist</string>', '<string name="app_name" translatable="false">LibreWrist Watch5 Lite</string>')
          p.write_text(s)
          PY
          grep -n 'applicationId\|versionName' patcher-app/app/build.gradle.kts
          grep -n 'app_name' patcher-app/app/src/main/res/values/strings.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install current Android command-line tools and SDK
        run: |
          mkdir -p "$RUNNER_TEMP/android-cmdline"
          wget -q -O "$RUNNER_TEMP/cmdline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline"
          SDKMANAGER="$RUNNER_TEMP/android-cmdline/cmdline-tools/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "platforms;android-37.0" \
            "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore persistent Lite signing key
        env:
          P12_BASE64: ${{ secrets.LITE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::Missing repository secret LITE_KEYSTORE_BASE64"
            exit 1
          fi
          keys="$RUNNER_TEMP/openshm-keys"
          ( umask 077
            mkdir -p "$keys"
            printf '%s' "$P12_BASE64" | base64 -d > "$keys/patcher.p12"
            printf '%s' 'LibreWristWatch5Lite-Key-2026' > "$keys/patcher.pass"
          )
          echo "OPENSHM_KEYS_DIR=$keys" >> "$GITHUB_ENV"
          echo "PATCHER_KEY_ALIAS=watch5lite" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: librewrist/patcher-app
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and prepare APK
        run: |
          src="librewrist/patcher-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$src"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$src"
          mkdir -p output
          cp "$src" output/LibreWrist_Watch5_Lite_R3.apk
          sha256sum output/LibreWrist_Watch5_Lite_R3.apk | tee output/SHA256SUMS.txt
          bytes="$(stat -c%s output/LibreWrist_Watch5_Lite_R3.apk)"
          echo "APK bytes: $bytes"
          test "$bytes" -lt 81672941
          ls -lh output/LibreWrist_Watch5_Lite_R3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreWrist-Watch5-Lite-R3
          path: |
            output/LibreWrist_Watch5_Lite_R3.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
