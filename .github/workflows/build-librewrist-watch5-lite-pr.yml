name: Build LibreWrist Watch5 Lite APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Fetch LibreWrist base
        run: |
          git clone https://github.com/LibreStatic/LibreWrist.git librewrist
          cd librewrist
          git checkout 96ab317741142932ca23e9feed83a912b28dbbcb

      - name: Apply Watch5 Lite modifications
        run: |
          cd librewrist
          git apply --check ../librewrist-watch5-lite.patch
          git apply ../librewrist-watch5-lite.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("patcher-app/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "io.openshm.patcher"', 'applicationId = "io.openshm.patcher.watch5lite"')
          s = s.replace('versionName = "0.9.5-local"', 'versionName = "0.9.5-watch5lite"')
          p.write_text(s)
          p = Path("patcher-app/app/src/main/res/values/strings.xml")
          s = p.read_text()
          s = s.replace('<string name="app_name" translatable="false">LibreWrist</string>', '<string name="app_name" translatable="false">LibreWrist Watch5 Lite</string>')
          p.write_text(s)
          PY
          grep -n 'applicationId\|versionName' patcher-app/app/build.gradle.kts
          grep -n 'app_name' patcher-app/app/src/main/res/values/strings.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK requirements
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: librewrist/patcher-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        run: |
          src="librewrist/patcher-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          mkdir -p output
          cp "$src" output/LibreWrist_Watch5_Lite.apk
          sha256sum output/LibreWrist_Watch5_Lite.apk | tee output/SHA256SUMS.txt
          ls -lh output/LibreWrist_Watch5_Lite.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreWrist-Watch5-Lite-APK
          path: |
            output/LibreWrist_Watch5_Lite.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
